name: KHATAWAS Android Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        required: true
        default: false
      version_override:
        description: 'Version override (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Validate & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify RNNoise Submodule Population
        run: |
          if [ ! -f "app/src/main/cpp/rnnoise/src/denoise.c" ]; then
            echo "::error::RNNoise git submodule was not populated properly during checkout."
            exit 1
          fi
          echo "RNNoise submodule successfully verified at app/src/main/cpp/rnnoise"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.1.12297006 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            TAG="v${{ github.event.inputs.version_override }}"
            VERSION="${{ github.event.inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="1.0"
            TAG="v1.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Target build: tag=${TAG}, version=${VERSION}"

      - name: Evaluate Release Signing Secrets
        id: signing_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected. Release build will be signed with repository production keystore."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing repository signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            echo "::notice::An automated CI testing keystore will be generated so a signed, installable APK is produced for release."
          fi

      - name: Prepare Keystore File
        run: |
          KEYSTORE_DIR=$(mktemp -d)
          if [ "${{ steps.signing_check.outputs.has_secrets }}" == "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_DIR}/release.keystore"
            chmod 600 "${KEYSTORE_DIR}/release.keystore"
            echo "KEYSTORE_FILE_PATH=${KEYSTORE_DIR}/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_DIR=${KEYSTORE_DIR}" >> "$GITHUB_ENV"
            echo "SIGNING_KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_DIR}/ci-testing.keystore" \
              -alias "khatawas-ci" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "khatawas_ci_pass" \
              -keypass "khatawas_ci_pass" \
              -dname "CN=KHATAWAS, OU=Engineering, O=KHATAWAS, L=Bangalore, ST=Karnataka, C=IN"
            chmod 600 "${KEYSTORE_DIR}/ci-testing.keystore"
            echo "KEYSTORE_FILE_PATH=${KEYSTORE_DIR}/ci-testing.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_DIR=${KEYSTORE_DIR}" >> "$GITHUB_ENV"
            echo "SIGNING_KEYSTORE_PASS=khatawas_ci_pass" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=khatawas-ci" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASS=khatawas_ci_pass" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Run Release Lint
        run: ./gradlew lintVitalRelease --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.SIGNING_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.SIGNING_KEY_PASS }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.ver.outputs.version }}" \
            --no-daemon

      - name: Secure Clean-up of Keystore
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_DIR }}" ] && [ -d "${{ env.KEYSTORE_DIR }}" ]; then
            rm -rf "${{ env.KEYSTORE_DIR }}"
            echo "Temporary keystore securely purged."
          fi

      - name: Locate Output APK & Verify Integrity
        id: apk_audit
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
              echo "signing_status=Unsigned (CI validation only)" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release APK was not generated at expected locations."
              exit 1
            fi
          else
            echo "Verifying APK signature with apksigner:"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_SRC"
            if [ "${{ steps.signing_check.outputs.has_secrets }}" == "true" ]; then
              echo "signing_status=Signed (Production Key, v2 Scheme)" >> "$GITHUB_OUTPUT"
            else
              echo "signing_status=Signed (CI Testing Key, v2 Scheme)" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "apk_src=$APK_SRC" >> "$GITHUB_OUTPUT"

      - name: Inspect Package Identity & Metadata
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/aapt2" dump badging "${{ steps.apk_audit.outputs.apk_src }}" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:|native-code:"

      - name: Prepare Release Artifacts & Generate Checksum
        id: bundle
        run: |
          mkdir -p dist
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          APK_NAME="KHATAWAS-${TAG}-release.apk"
          CHECKSUM_NAME="KHATAWAS-${TAG}-SHA256.txt"
          BUILD_INFO_NAME="KHATAWAS-${TAG}-build-info.txt"

          cp "${{ steps.apk_audit.outputs.apk_src }}" "dist/${APK_NAME}"

          cd dist
          sha256sum "${APK_NAME}" > "${CHECKSUM_NAME}"
          SHA256_HASH=$(cut -d ' ' -f 1 "${CHECKSUM_NAME}")
          APK_SIZE_BYTES=$(stat -c%s "${APK_NAME}")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${APK_SIZE_BYTES}/(1024*1024)}")
          cd ..

          # Generate Build Info Metadata
          cat << EOF > "dist/${BUILD_INFO_NAME}"
          KHATAWAS Release Build Metadata
          ==================================
          Application ID:   com.khatawas
          Version Name:     ${VERSION}
          Version Code:     1
          Release Tag:      ${TAG}
          Commit SHA:       ${{ github.sha }}
          Build Timestamp:  $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Target ABIs:      armeabi-v7a, arm64-v8a, x86_64
          Signing Status:   ${{ steps.apk_audit.outputs.signing_status }}
          Min SDK:          24 (Android 7.0)
          Target SDK:       34 (Android 14)
          SHA-256 Checksum: ${SHA256_HASH}
          File Size:        ${APK_SIZE_MB} MB (${APK_SIZE_BYTES} bytes)

          GNANI API Credential Security Note:
          -----------------------------------
          To prevent credential extraction and unauthorized account billing,
          privileged GNANI API keys are not compiled into this public release APK.
          Real-time speech recognition (STT) and voice synthesis (TTS) can be
          connected via authenticated server proxy or client environment configuration.
          EOF

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${CHECKSUM_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_info_name=${BUILD_INFO_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"
          echo "size_mb=${APK_SIZE_MB}" >> "$GITHUB_OUTPUT"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KHATAWAS-${{ steps.ver.outputs.tag }}-artifacts
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: KHATAWAS ${{ steps.ver.outputs.tag }} — Android Testing Release
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## KHATAWAS ${{ steps.ver.outputs.tag }} — Android Testing Release

            > **Notice:** This testing pre-release build is intended for device verification and testing.

            ### Integrity & Checksum
            - **Asset:** \`${{ steps.bundle.outputs.apk_name }}\` (${{ steps.bundle.outputs.size_mb }} MB)
            - **SHA-256:** \`${{ steps.bundle.outputs.sha256 }}\`
            - **Commit SHA:** \`${{ github.sha }}\`
            - **Signing Status:** ${{ steps.apk_audit.outputs.signing_status }}

            ### Installation Instructions
            1. Download \`${{ steps.bundle.outputs.apk_name }}\` from the release assets below.
            2. Tap the downloaded APK to install.
            3. If Android prompts **Install unknown apps**, allow it for your browser or file manager.
            4. Open **KHATAWAS** and grant microphone permissions when prompted for voice features.

            ### GNANI Speech API Security Notice
            To safeguard provider account credentials, private GNANI API keys are strictly omitted from public APK binaries. Voice features operate in local shadow mode unless connected to an authorized KHATAWAS backend proxy.
          files: |
            dist/${{ steps.bundle.outputs.apk_name }}
            dist/${{ steps.bundle.outputs.checksum_name }}
            dist/${{ steps.bundle.outputs.build_info_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Production Signing Status
        if: always()
        run: |
          if [ "${{ steps.signing_check.outputs.has_secrets }}" == "true" ]; then
            echo "Release APK was signed using repository production secrets."
          else
            echo "::notice::Release APK was signed with the automated CI testing key. To sign with your official private release key, configure repository secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
          fi
