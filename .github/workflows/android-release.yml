name: KHATAWAS Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Sign, Validate & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building KHATAWAS release tag: ${TAG} (version ${VERSION})"

      - name: Validate Signing Secrets Configuration
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Release build aborted: ANDROID_KEYSTORE_BASE64 secret is not configured in GitHub repository secrets."
            echo "::error::Signed production releases cannot be published without a valid release keystore."
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Release build aborted: Missing one or more required signing secrets (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi

      - name: Decode Release Keystore
        run: |
          KEYSTORE_DIR=$(mktemp -d)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_DIR}/release.keystore"
          chmod 600 "${KEYSTORE_DIR}/release.keystore"
          echo "KEYSTORE_PATH=${KEYSTORE_DIR}/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_DIR=${KEYSTORE_DIR}" >> "$GITHUB_ENV"

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Release Lint
        run: ./gradlew lintVitalRelease --no-daemon

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version_step.outputs.version }}" \
            --no-daemon

      - name: Secure Clean-up of Keystore File
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_DIR }}" ] && [ -d "${{ env.KEYSTORE_DIR }}" ]; then
            rm -rf "${{ env.KEYSTORE_DIR }}"
            echo "Temporary keystore securely erased from CI runner."
          fi

      - name: Verify Signed APK Existence
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Expected signed release APK at $RELEASE_APK was not generated."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "RELEASE_APK_PATH=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Verify APK Signature with apksigner
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "${{ env.RELEASE_APK_PATH }}"

      - name: Verify Package Metadata
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/aapt2" dump badging "${{ env.RELEASE_APK_PATH }}" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:|native-code:"

      - name: Package Release Assets & Compute Checksum
        id: assets
        run: |
          mkdir -p release-dist
          TAG="${{ steps.version_step.outputs.tag }}"
          APK_NAME="KHATAWAS-${TAG}-release.apk"
          CHECKSUM_NAME="KHATAWAS-${TAG}-SHA256.txt"

          cp "${{ env.RELEASE_APK_PATH }}" "release-dist/${APK_NAME}"

          cd release-dist
          sha256sum "${APK_NAME}" > "${CHECKSUM_NAME}"
          SHA256_HASH=$(cut -d ' ' -f 1 "${CHECKSUM_NAME}")
          APK_SIZE_BYTES=$(stat -c%s "${APK_NAME}")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${APK_SIZE_BYTES}/(1024*1024)}")
          cd ..

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${CHECKSUM_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"
          echo "size_mb=${APK_SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_SIZE_BYTES}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        run: |
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          cat << 'EOF' > RELEASE_NOTES.md
          ## KHATAWAS ${{ steps.version_step.outputs.tag }} — Rural-First Android Release

          **Release Date:** ${RELEASE_DATE}  
          **Package:** \`com.khatawas\`  
          **Supported Android Versions:** Android 7.0 (Nougat, API 24) to Android 14 (API 34)  
          **Architectures (ABIs):** \`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`  

          ---

          ### Release Assets & Integrity

          | Asset | Size | SHA-256 Checksum |
          |---|---|---|
          | \`${{ steps.assets.outputs.apk_name }}\` | ${{ steps.assets.outputs.size_mb }} MB (${{ steps.assets.outputs.size_bytes }} B) | \`${{ steps.assets.outputs.sha256 }}\` |
          | \`${{ steps.assets.outputs.checksum_name }}\` | Text | — |

          To verify file integrity before installation on Linux/macOS:
          \`\`\`bash
          sha256sum -c ${{ steps.assets.outputs.checksum_name }}
          \`\`\`
          Or on Windows PowerShell:
          \`\`\`powershell
          (Get-FileHash -Algorithm SHA256 ./${{ steps.assets.outputs.apk_name }}).Hash -eq "${{ steps.assets.outputs.sha256 }}"
          \`\`\`

          ---

          ### What's in this Release

          - **Rural-First UI/UX:** High-contrast 60dp touch targets, card-based layout, and Hindi/Kannada/English localization designed for small shopkeepers.
          - **Offline-First Secure Ledger:** SQLite database with SQLCipher AES-256 encryption. Transactions are committed locally before cloud sync.
          - **On-Device Voice & AI Intelligence:** Gnani speech recognition engine, RNNoise audio denoising, and INT8 quantized on-device student model.
          - **SurrealDB Native Graph Relations:** Edge relationships (\`family_of\`, \`owns_customer\`, \`has_transaction\`) and entity disambiguation for spoken references (*e.g., "Arun ke papa"*).
          - **Privacy-First Masked Display:** Sensitive balances and amounts start masked (\`###XXX\`) until unlocked via Administrator PIN or Android BiometricPrompt.

          ---

          ### Installation Instructions

          1. Download \`${{ steps.assets.outputs.apk_name }}\` from the Assets section below.
          2. Open the downloaded APK on your Android device.
          3. If prompted by Android, tap **Settings** and allow **Install unknown apps** for your browser or file manager (do not disable system security globally).
          4. Tap **Install** and then open **KHATAWAS**.
          5. Grant the microphone permission when prompted if you wish to use voice entry.

          ---

          ### Known Limitations & Testing Status

          - **Testing Status:** Pre-release test build verified via automated Gradle unit tests (11 suites), Android Lint, APK signature verification (v2 scheme), and real-device smoke test on physical Android hardware (Vivo / ARM64).
          - **Voice Input:** Requires local audio permissions. Real-time cloud sync requires an active connection to your KHATAWAS SurrealDB backend.
          EOF
          sed -i "s/\${RELEASE_DATE}/${RELEASE_DATE}/g" RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: KHATAWAS ${{ steps.version_step.outputs.tag }} — Android Testing Release
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          files: |
            release-dist/${{ steps.assets.outputs.apk_name }}
            release-dist/${{ steps.assets.outputs.checksum_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
