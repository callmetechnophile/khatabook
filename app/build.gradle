plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

Properties properties = new Properties()
File localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}

android {
    namespace 'com.khatawas'
    compileSdk 34
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId "com.khatawas"
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty("versionCode")?.toInteger() ?: 1)
        versionName (project.findProperty("versionName") ?: "1.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Support ARM physical devices and x86_64 Android Studio emulators
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        // Pull API key and WebSocket URLs from local.properties or defaults
        String apiKey = properties.getProperty("GNANI_API_KEY") ?: project.findProperty("GNANI_API_KEY") ?: ""
        buildConfigField "String", "GNANI_API_KEY", "\"${apiKey}\""

        String sttUrl = properties.getProperty("GNANI_STT_WS_URL") ?: project.findProperty("GNANI_STT_WS_URL") ?: "wss://api.vachana.ai/stt/v3/stream"
        buildConfigField "String", "GNANI_STT_WS_URL", "\"${sttUrl}\""

        String ttsUrl = properties.getProperty("GNANI_TTS_WS_URL") ?: project.findProperty("GNANI_TTS_WS_URL") ?: "wss://asr.gnani.ai/api/v1/tts"
        buildConfigField "String", "GNANI_TTS_WS_URL", "\"${ttsUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            String ksFile = System.getenv("KEYSTORE_FILE") ?: (project.findProperty("KEYSTORE_FILE") ?: "")
            String ksPass = System.getenv("KEYSTORE_PASSWORD") ?: (project.findProperty("KEYSTORE_PASSWORD") ?: "")
            String kAlias = System.getenv("KEY_ALIAS") ?: (project.findProperty("KEY_ALIAS") ?: "")
            String kPass = System.getenv("KEY_PASSWORD") ?: (project.findProperty("KEY_PASSWORD") ?: "")

            if (ksFile && file(ksFile).exists() && ksPass && kAlias && kPass) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

task buildRustNative {
    description = "Compiles khatawas_android for all active Android ABIs via Cargo and copies to jniLibs"
    onlyIf {
        boolean forceRebuild = project.hasProperty("buildRustNative") && project.property("buildRustNative") == "true"
        boolean missingLibs = !file("${project.projectDir}/src/main/jniLibs/arm64-v8a/libkhatawas_android.so").exists() ||
                              !file("${project.projectDir}/src/main/jniLibs/armeabi-v7a/libkhatawas_android.so").exists() ||
                              !file("${project.projectDir}/src/main/jniLibs/x86_64/libkhatawas_android.so").exists()
        return forceRebuild || missingLibs
    }
    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def cargoCmd = isWindows ? "cargo.exe" : "cargo"
        def abiMap = [
            'arm64-v8a': 'aarch64-linux-android',
            'armeabi-v7a': 'armv7-linux-androideabi',
            'x86_64': 'x86_64-linux-android'
        ]
        abiMap.each { abi, target ->
            def pb = new ProcessBuilder(cargoCmd, "build", "--workspace", "--target", target, "--release")
            pb.directory(file("${project.rootDir}/rust-engine"))
            pb.inheritIO()
            def proc = pb.start()
            def exitCode = proc.waitFor()
            if (exitCode != 0) {
                throw new GradleException("Cargo build failed for target ${target} with exit code ${exitCode}")
            }

            def srcSo = file("${project.rootDir}/rust-engine/target/${target}/release/libkhatawas_android.so")
            def destDir = file("${project.projectDir}/src/main/jniLibs/${abi}")
            destDir.mkdirs()
            copy {
                from srcSo
                into destDir
            }
        }
    }
}

preBuild.dependsOn buildRustNative

dependencies {
    // Kotlin standard library & Android Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"

    // Java-WebSocket for WebSocket streaming (API 24+)
    implementation "org.java-websocket:Java-WebSocket:1.5.3"

    // SQLCipher encrypted database (AES-256)
    implementation "net.zetetic:android-database-sqlcipher:4.5.4"
    implementation "androidx.sqlite:sqlite:2.3.1"

    // AndroidX Security for Keystore and EncryptedSharedPreferences key generation
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // AndroidX Biometric for Fingerprint, Face, and Device Credential Authentication
    implementation "androidx.biometric:biometric:1.1.0"

    // Microsoft ONNX Runtime Android for edge AI model inference
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.0"

    // Local unit tests
    testImplementation "junit:junit:4.13.2"

    // Android Studio instrumented tests
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
